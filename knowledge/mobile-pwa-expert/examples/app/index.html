<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F33" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Finance Match Orlando</title>
</head>
<body>
  <main><h1>Your matches</h1><p id="status">Loading…</p></main>
  <p id="installInstructions">On iPhone: tap Share, then Add to Home Screen.</p>
  <style>#installInstructions{display:none}@media (display-mode: browser){#installInstructions{display:block}}</style>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" })
      .then(() => navigator.serviceWorker.ready).then(() => { document.getElementById("status").textContent = "Ready (works offline)"; });
  </script>
</body>
</html>
