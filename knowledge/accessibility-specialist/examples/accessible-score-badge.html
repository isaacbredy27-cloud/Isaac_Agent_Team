<!-- Worked example (reference markup): a score badge that never relies on color alone (WCAG 1.4.1) and reads well in screen readers. -->
<p class="badge badge--green">
  <span aria-hidden="true">●</span>
  <span>86</span><span class="visually-hidden">,</span>
  <span>Strong Match</span>
</p>
<!-- VoiceOver/TalkBack read: "86, Strong Match". Yellow band uses ◐ and "Moderate Match"; red uses ○ and "Weak Match". -->
